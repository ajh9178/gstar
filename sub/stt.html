<body>
	<a href="../index.html" class="back_go"></a>
	
	<!-- 동적으로 분할 이미지가 삽입될 컨테이너 -->
	<div class="sub-detail" id="detailContainer"></div>
	
	<a href="javascript:void(0);" class="top_go"></a>
	<script>
		/* 동작 타이머 */
		const IDLE_TIME_LIMIT = 120000;
		let idleTimer;
		const targetUrl = '../index.html';
		function startIdleTimer() {
			clearTimeout(idleTimer);
			idleTimer = setTimeout(redirectToHome, IDLE_TIME_LIMIT);
		}
		function redirectToHome() {
			window.location.href = targetUrl;
		}
		$(document).on('mousemove keydown scroll touchstart touchend', function() {
			startIdleTimer();
		});
		startIdleTimer();
		
		/* 폴더별 분할 이미지 순차 불러오기 & AOS 적용 */
		const urlParams = new URLSearchParams(window.location.search);
		const imgNum = urlParams.get('img') || '01';
		const container = document.getElementById('detailContainer');

		function loadSplitImages(index) {
			const partStr = String(index).padStart(2, '0');
			// 경로: ../img/body/stt_01/stt_01.jpg 형태
			const imgSrc = `../img/body/stt_${imgNum}/stt_${partStr}.jpg`;

			const img = new Image();
			img.src = imgSrc;
			img.alt = `상세 이미지 ${imgNum}-${partStr}`;

			img.onload = function() {
				const wrapper = document.createElement('div');
				wrapper.setAttribute('data-aos', 'fade-up');
				wrapper.appendChild(img);
				container.appendChild(wrapper);

				if (typeof AOS !== 'undefined') {
					AOS.refresh();
				}

				loadSplitImages(index + 1);
			};

			img.onerror = function() {
				if (typeof AOS !== 'undefined') {
					AOS.refresh();
				}
			};
		}

		// stt_01.jpg 부터 탐색 시작
		loadSplitImages(1);
	</script>
	<script src="../js/common.js"></script>
